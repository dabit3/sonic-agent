name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Lightning — traces conversations, LLM calls, and tool usage. Opt-in via `lightning plugins enable observability/langfuse` (or check the box in `lightning plugins`)."
author: NousResearch
requires_env:
  - LIGHTNING_LANGFUSE_PUBLIC_KEY
  - LIGHTNING_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
